name: Stability checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            postgres: '16-bookworm'
          - python: '3.12'
            postgres: '17-alpine'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas_test_only
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/locked-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checked dependency snapshot
        run: python -m pip install --require-hashes -r requirements/locked-dev.txt
      - name: Verify dependencies and static errors
        run: |
          python -m pip check
          python -m ruff check .
          python -m compileall -q src main.py api.py scripts
      - name: Unit tests (no application database)
        run: python -m unittest discover -s tests
      - name: Required real PostgreSQL tests (no skips)
        env:
          ATLAS_TEST_DSN: host=127.0.0.1 port=5432 dbname=atlas_ci user=atlas_test password=atlas_test_only
        run: python scripts/run_postgres_tests.py
      - name: Check CLI migration lifecycle
        env:
          PG_HOST: 127.0.0.1
          PG_PORT: '5432'
          PG_DATABASE: atlas_ci
          PG_USER: atlas_test
          PG_PASSWORD: atlas_test_only
        run: |
          python main.py init-db
          python main.py init-db
          python main.py db-status

  frontend:
    name: Canvas and browser regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
      - run: npm run test:frontend
